<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> OS Airlines -Datos de Reserva </title>


    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/modulos/formulario.css">
    <link rel="icon" type="image/png" href="assets/icons/loguito-bueno.png">

</head>
<body>

    <header class="header-principal">
        <div class="logo">
            <a href="home.html"><img src="assets/img/logo-header-1.png" alt=""></a>
        </div>
        <nav class="navigation">
            <a href="">Politicas</a>
            <a href="">Contactanos</a>
            <a href="">Puntuanos</a>
        </nav>
    </header>
    <main> 
       
         <h2>Datos de la reserva</h2>

        <!--el formulario de reserva-->
        <form id="formularioReserva" action="asientos.html">

            <!--trayecto -->
            <fieldset> 
                <div class="grupo">
                    <label> Tipo de Viaje: </label>
                    <label><input type="radio" name="tipoViaje" value="solo ida "> Solo ida</label>
                    <label><input type="radio" name="tipoViaje" value="ida y vuelta "> Ida y vuelta</label>
               </div>

               <div class="forma-grupo">
                <label for="fechaIda">Fecha de ida:</label>
                <input type="date" id="fechaIda">
               </div>
            </fieldset>
            <!--Datos personales-->
            <fieldset> 
                <div class="forma-grupo">
                    <label for="nombre">Nombre:</label>
                    <input type="text"id="nombre" placeholder="Ingrese su nombre">
                </div>

                <div class="forma-grupo">
                    <label for="apellido">Apellido:</label>
                    <input type="text" id="apellido" placeholder="Ingrese su apellido">
                </div>

                <div class="forma-grupo">
                    <label for="tipoDocumento">Tipo de documento: </label>
                    <select id="tipoDocumento">
                        <option value="cedula">Cedula</option>
                        <option value="pasaporte">pasaporte</option>
                    </select>
                </div>

                <div class="forma-grupo">
                    <label for="numDoc"> Numero de documento</label>
                    <input type="text" id="numDoc">
                </div>

                <div class="forma-grupo">
                    <label for="fechaNacimiento">Fecha de Nacimiento:</label>
                    <input type="date" id="fechaNacimiento" required>
                </div>

                <div class="forma-grupo">
                    <label for="edadCalculada">Edad Calculada:</label>
                    <input type="text" id="edadCalculada" readonly placeholder="Edad">
                </div>

                <div class="forma-grupo">   
                    <label for="genero">genero</label>
                    <select id="genero">
                        <option value="masculino">Masculino</option>
                        <option value="femenino">Femenino</option>
                    </select>
                </div>

                <div class="forma-grupo" id="preguntaEmbarazo" style="display: none;">
                    <label>¿Está embarazada?</label>
                        <div class="grupo-radio">
                            <label><input type="radio" name="embarazo" value="no" checked> No</label>
                            <label><input type="radio" name="embarazo" value="si"> Sí</label>
                        </div>
                </div>

                <div class="forma-grupo">
                    <label for="correo">Correo Electronico: </label>
                    <input type="email" id="correo" placeholder="ejemplo@gmail.com" required>
                </div>

                <div class="forma-grupo">
                    <label for="telefono">Número de Teléfono</label>
                    <input type="tel" id="telefono">
                </div>
                    <!--Informacion de contacto-->
                <div class="forma-grupo">
                    <label for="cantAdultos">Cantidad de Adultos (+18):</label>
                    <div class="contador">
                        <button type="button" class="btn-contador" onclick="modificarContador('cantAdultos', -1)">-</button>
                        <input type="number" id="cantAdultos" min="1" value="1" readonly>
                        <button type="button" class="btn-contador" onclick="modificarContador('cantAdultos', 1)">+</button>
                    </div>
                </div>

                <div class="forma-grupo">
                    <label for="cantMenores">Cantidad de Menores (-18):</label>
                    <div class="contador">
                        <button type="button" class="btn-contador" onclick="modificarContador('cantMenores', -1)">-</button>
                        <input type="number" id="cantMenores" min="0" value="0" readonly>
                        <button type="button" class="btn-contador" onclick="modificarContador('cantMenores', 1)">+</button>
                    </div>
                </div>

                <div class="forma-grupo">
                <label for="cantMaletas">Cantidad de Maletas:</label>
                <div class="contador">
                    <button type="button" class="btn-contador" onclick="modificarContador('cantMaletas', -1)">-</button>
                    <input type="number" id="cantMaletas" min="0" value="1" readonly>
                    <button type="button" class="btn-contador" onclick="modificarContador('cantMaletas', 1)">+</button>
                </div>
                </div>

            </fieldset>
            <fieldset>
                <div class="forma-grupo">
                    <label>
                        <input type="checkbox" id="discapacidad">
                        El pasajero tiene alguna discapacidad o movilidad reducida
                    </label>
                </div>
            </fieldset>

            <!-- BOTÓN DE ACCIÓN -->
            <div class="forma-grupo" onclick="window.location.href='asientos.html'"></div>>
                <button type="submit" id="btnContinuar">Continuar a Selección de Asientos</button>
            </div>

        </form>

        



    </main>

</body>
</html>
